name: Build OCEAN

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  PYTHON_VERSION: "3.9"
  PULSEQ_LIB_REPO: "https://github.com/kherz/pulseq-cest-library"

jobs:

  build-windows:
    name: "Build · Windows .exe"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install SWIG
        run: choco install swig --no-progress -y

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib pillow
          pip install itk-elastix
          pip install -e open-py-cest-mrf/

      - name: Compile BMCSimulator + pypulseq (C++ core, vendored)
        working-directory: open-py-cest-mrf/cest_mrf/sim_lib
        shell: bash
        run: |
          pip install --upgrade pip wheel "setuptools<81"   # setuptools 81 removed pkg_resources.NullProvider, which PyInstaller's pyi_rth_pkgres runtime hook needs
          rm -rf build dist *.egg-info
          rm -f BMCSimulator.py BMCSimulator_wrap.cpp *.so *.pyd
          python setup.py build_ext --inplace
          pip install . --no-deps --no-build-isolation
          python "$GITHUB_WORKSPACE/.github/fix_bmc_encoding.py" ./BMCSimulator.py
          cd "$GITHUB_WORKSPACE/open-py-cest-mrf/cest_mrf/pypulseq"
          pip install . --no-deps --no-build-isolation

      - name: Fetch pulseq-CEST library
        run: git clone --depth 1 ${{ env.PULSEQ_LIB_REPO }} pulseq-cest-library

      - name: Generate Windows icon (.ico)
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path
          src = Path("icon.png"); dst = Path("assets/AppIcon.ico")
          if src.exists():
              Image.open(src).convert("RGBA").save(
                  dst, format="ICO",
                  sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
              print("Saved", dst)
          else:
              print("icon.png not found — building without custom icon")

      - name: Build with PyInstaller
        env:
          OCEAN_PULSEQ_LIBRARY: ${{ github.workspace }}\pulseq-cest-library\seq-library
        run: pyinstaller OCEAN.spec --clean --noconfirm --log-level WARN

      # pypulseq reads <bundle>/VERSION at import; a build without it only
      # fails later, when a user writes a sequence — so assert it here.
      - name: Check bundled pypulseq VERSION file
        shell: pwsh
        run: |
          if (!(Test-Path dist\OCEAN\_internal\VERSION)) {
            Write-Error "dist\OCEAN\_internal\VERSION is missing - pypulseq would crash at import"; exit 1
          }
          Get-Content dist\OCEAN\_internal\VERSION

      - name: Zip dist/OCEAN → OCEAN.zip
        shell: pwsh
        run: Compress-Archive -Path dist\OCEAN -DestinationPath dist\OCEAN.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OCEAN-Windows
          path: dist/OCEAN.zip
          retention-days: 30

  # NOTE: the macOS .dmg is NOT built here — it is built on the maintainer's Mac
  # with build_dmg.sh and attached to the GitHub release by hand (gh release
  # create / upload).  CI produces the Windows .zip and the Linux .tar.gz only.

  build-linux:
    name: "Build · Linux tar.gz"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install SWIG + Qt runtime libs
        run: sudo apt-get update && sudo apt-get install -y swig libegl1 libgl1

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib
          pip install itk-elastix
          pip install -e open-py-cest-mrf/

      - name: Compile BMCSimulator + pypulseq (C++ core, vendored)
        working-directory: open-py-cest-mrf/cest_mrf/sim_lib
        shell: bash
        run: |
          pip install --upgrade pip wheel "setuptools<81"   # setuptools 81 removed pkg_resources.NullProvider, which PyInstaller's pyi_rth_pkgres runtime hook needs
          rm -rf build dist *.egg-info
          rm -f BMCSimulator.py BMCSimulator_wrap.cpp *.so *.pyd
          python setup.py build_ext --inplace
          pip install . --no-deps --no-build-isolation
          python "$GITHUB_WORKSPACE/.github/fix_bmc_encoding.py" ./BMCSimulator.py
          cd "$GITHUB_WORKSPACE/open-py-cest-mrf/cest_mrf/pypulseq"
          pip install . --no-deps --no-build-isolation

      - name: Fetch pulseq-CEST library
        run: git clone --depth 1 ${{ env.PULSEQ_LIB_REPO }} pulseq-cest-library

      - name: Build with PyInstaller
        env:
          OCEAN_PULSEQ_LIBRARY: ${{ github.workspace }}/pulseq-cest-library/seq-library
        run: pyinstaller OCEAN.spec --clean --noconfirm --log-level WARN

      - name: Check bundled pypulseq VERSION file
        run: test -f dist/OCEAN/_internal/VERSION && cat dist/OCEAN/_internal/VERSION

      - name: Smoke-test the built app (fail the build if it crashes on startup)
        run: |
          set +e
          OUT=$(QT_QPA_PLATFORM=offscreen timeout 30 dist/OCEAN/OCEAN 2>&1)
          echo "$OUT" | head -40
          if echo "$OUT" | grep -qiE "Failed to execute script|NullProvider|ModuleNotFoundError|Traceback \(most recent"; then
            echo "::error::OCEAN crashed on startup — see log above"; exit 1
          fi
          echo "startup smoke test passed"

      - name: Tar dist/OCEAN → OCEAN.tar.gz
        run: tar -czf dist/OCEAN.tar.gz -C dist OCEAN

      - uses: actions/upload-artifact@v4
        with:
          name: OCEAN-Linux
          path: dist/OCEAN.tar.gz
          retention-days: 30

  release:
    name: "Publish GitHub Release"
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: OCEAN-Windows, path: release-files/ }
      - uses: actions/download-artifact@v4
        with: { name: OCEAN-Linux, path: release-files/ }
      # The release for this tag normally already exists (the .dmg is uploaded
      # to it from the maintainer's Mac); this step replaces the Windows/Linux
      # assets on it (same-name assets are overwritten), or creates it if absent.
      # Only the assets are touched: no name/body/notes are passed, so the
      # release's existing title and hand-written notes are left as they are
      # (OCEAN.dmg uploaded from the Mac is not touched either).
      - name: Publish Windows + Linux artefacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-files/*
